name: Build Chạm iOS IPA (Sideloadly / AltStore)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    name: Build Unsigned Cham.ipa on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kiểm tra cú pháp & chuẩn bị bundle iOS độc lập
        run: |
          npm run check
          node scripts/prepare-ios.mjs

      - name: Khởi tạo dự án Capacitor iOS
        working-directory: ios-build
        run: |
          npm install --no-audit --no-fund
          # Capacitor 7 sync uses CocoaPods; create the matching Podfile template.
          npx cap add ios
          test -f ios/App/Podfile
          npx cap sync ios

      - name: Cấu hình quyền Camera, Micro, Thư viện ảnh & Icon iOS
        working-directory: ios-build
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Chạm" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Chạm" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Chạm cần quyền Camera để chụp ảnh Digital và Photobooth.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Chạm cần quyền Micro khi quay video có âm thanh.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Chạm cần quyền Thư viện ảnh để chọn ảnh và video ghép khung.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Chạm cần quyền lưu ảnh và video Photobooth về máy.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || true

          # Chuyển icon.svg sang PNG 1024x1024 cho màn hình chính iPhone
          qlmanage -t -s 1024 -o /tmp ../public/icon.svg || true
          if [ -f /tmp/icon.svg.png ]; then
            sips -s format png -z 1024 1024 /tmp/icon.svg.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png || true
          fi

      - name: Biên dịch Xcode & đóng gói Cham-unsigned.ipa
        working-directory: ios-build/ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            TARGET=(-workspace App.xcworkspace)
          else
            TARGET=(-project App.xcodeproj)
          fi
          xcodebuild build \
            "${TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload
          cp -R ./DerivedData/Build/Products/Release-iphoneos/App.app ./Payload/App.app
          zip -qry ../../../Cham-unsigned.ipa Payload
          rm -rf Payload

      - name: Tải lên file Cham-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Cham-unsigned-ipa
          path: Cham-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
